[project]
name = "fastapi-mongo-chat"
version = "0.1.0"
description = "A real-time messaging application built with FastAPI, MongoDB, and Redis. Features user authentication, direct messaging via WebSocket, and RESTful API for user management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.3.0",
    "beanie>=1.29.0",
    "celery>=5.5.2",
    "fastapi>=0.115.12",
    "passlib>=1.7.4",
    "pika>=1.3.2",
    "pydantic-settings>=2.9.1",
    "pyjwt>=2.10.1",
    "pymongo>=4.13.0",
    "python-multipart>=0.0.20",
    "redis>=6.2.0",
    "uvicorn[standard]>=0.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.11",
    "pre-commit>=4.2.0",
]
