<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Chat</title>
</head>
<body>

<h1>Users</h1>

<div>
    <input type="text" id="from_user" placeholder="Sender"/>
    <input type="text" id="to_user" placeholder="Receiver"/>
    <button id="connect">Connect</button>
</div>

<h1>WebSocket Chat</h1>

<form onsubmit="sendMessage(event)">
    <input type="text" id="messageText" autocomplete="off" placeholder="Message"/>
    <button>Send</button>
</form>

<ul id="messages"></ul>

<script>
    let ws = null;

    document.getElementById('connect').onclick = function () {
        const fromUser = document.getElementById('from_user').value.trim();
        const toUser = document.getElementById('to_user').value.trim();

        const query = new URLSearchParams({
            token: fromUser,
        }).toString();

        ws = new WebSocket(`ws://localhost:8000/api/v1/chat/ws?${query}`);

        ws.onmessage = function (event) {
            const li = document.createElement('li');
            li.textContent = event.data;
            document.getElementById('messages').appendChild(li);
        };
    };

    function sendMessage(event) {
        event.preventDefault();
        if (!ws) return;

        const text = document.getElementById("messageText").value.trim();
        const receiver = document.getElementById('to_user').value.trim();

        const msg = {
            message: text,
            receiver: receiver,
            type: "placeholder"
        };

        ws.send(JSON.stringify(msg));
        document.getElementById("messageText").value = "";
    }
</script>

</body>
</html>
